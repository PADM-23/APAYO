name: 기능 구현
description: 새로운 기능이나 개선 작업을 구현합니다.
title: "[Feature] "
labels: ["feature"]
body:

  - type: textarea
    id: solution
    attributes:
      label: 작업 내용
      description: 필요한 기능을 간단히 적어주세요.
      placeholder: 입력한 증상을 한국어로 번역하고 원문과 함께 표시합니다.
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: 참고 자료
      description: 화면, API, 공공데이터 또는 관련 링크가 있으면 첨부해주세요.

