name: 기능 제안
description: 새로운 기능이나 개선 작업을 제안합니다.
title: "[Feature] "
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결할 문제
      description: 누구의 어떤 불편을 해결하나요?
      placeholder: 외국인 농업 종사자가 증상을 한국어로 설명하기 어렵습니다.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 작업 내용
      description: 필요한 기능을 간단히 적어주세요.
      placeholder: 입력한 증상을 한국어로 번역하고 원문과 함께 표시합니다.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      placeholder: "- 번역 결과가 표시된다.\n- 실패 시 재시도할 수 있다."
    validations:
      required: true

  - type: textarea
    id: reference
    attributes:
      label: 참고 자료
      description: 화면, API, 공공데이터 또는 관련 링크가 있으면 첨부해주세요.

